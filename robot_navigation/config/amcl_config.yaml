amcl:
  ros__parameters:
    use_sim_time: True

    # ── Hareket Modeli ─────────────────────────────────────────────────────────
    # Mecanum (holonomic/omni) robot için OmniMotionModel zorunludur.
    # DifferentialMotionModel Y-ekseni (straf) hareketini modellemiyor → AMCL kayıyor.
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # Alpha değerleri: odometri gürültüsü gerçekçi şekilde modellenmeli.
    # Çok düşük değerler (0.005) parçacık dağılımını bastırır → filter divergence.
    # Mecanum için alpha5 lateral straf gürültüsünü temsil eder.
    alpha1: 0.15   # Rotasyondan kaynaklanan rotasyon gürültüsü
    alpha2: 0.15   # Translasyondan kaynaklanan rotasyon gürültüsü
    alpha3: 0.15   # Translasyondan kaynaklanan translasyon gürültüsü
    alpha4: 0.15   # Rotasyondan kaynaklanan translasyon gürültüsü
    alpha5: 0.10   # Lateral straf gürültüsü (mecanum'a özgü)

    # ── Frame'ler ──────────────────────────────────────────────────────────────
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # ── Lazer / Sensör Modeli ──────────────────────────────────────────────────
    laser_model_type: "likelihood_field"
    laser_max_range: 30.0          # LIDAR-X200 menzili
    laser_min_range: 0.20          # Yakın gürültülü ölçümleri filtrele
    laser_likelihood_max_dist: 2.0 # Harita eşleştirme için max arama mesafesi
    max_beams: 360                 # Dual lidar → daha iyi kapsama

    # Beam skip: dinamik engeller için (depo ortamında araçlar, insanlar)
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Ölçüm modeli ağırlıkları (z_hit + z_short + z_max + z_rand = 1.0)
    z_hit: 0.85    # Lidar ölçümlerine güven - yüksek tutuldu
    z_max: 0.02    # Max range ölçümü olasılığı
    z_rand: 0.10   # Rastgele gürültü olasılığı
    z_short: 0.03  # Kısa ölçüm olasılığı
    sigma_hit: 0.15  # Gaussian genişliği - 0.1 çok dardı, 0.15 daha stabil
    lambda_short: 0.1

    # ── Parçacık Filtresi ──────────────────────────────────────────────────────
    min_particles: 2000
    max_particles: 6000
    pf_err: 0.02
    pf_z: 0.99
    resample_interval: 1           # Her güncelleme adımında resample

    # Recovery: kidnapped robot durumu için makul değerler
    recovery_alpha_fast: 0.05      # Hızlı iyileşme katsayısı
    recovery_alpha_slow: 0.001     # Yavaş iyileşme katsayısı

    # ── Güncelleme Eşikleri ────────────────────────────────────────────────────
    update_min_d: 0.025            # 2.5 cm hareket → güncelleme
    update_min_a: 0.025            # ~1.4 derece dönüş → güncelleme

    # ── TF / Diğer ────────────────────────────────────────────────────────────
    tf_broadcast: true
    transform_tolerance: 0.3       # Dual lidar merge gecikmesi için 0.3s
    save_pose_rate: 0.5

    # ── Başlangıç Pose ─────────────────────────────────────────────────────────
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    scan_topic: scan
    map_topic: map

    initial_pose_a: 0.0
    initial_cov_aa: 0.1   # Başlangıç açısal belirsizliği (~0.3 rad std)
    initial_cov_xx: 0.1   # Başlangıç x belirsizliği (~0.3 m std)
    initial_cov_yy: 0.1   # Başlangıç y belirsizliği (~0.3 m std)
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
