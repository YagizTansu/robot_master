bt_navigator:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /tricycle_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: "$(find-pkg-share robot_navigation)/behavior_trees/navigate_w_replanning_simple.xml"
    default_nav_through_poses_bt_xml: ""
    # Custom BT plugin library names
    plugin_lib_names:
      - battery_check_action_bt_node
      - get_charge_station_pose_action_bt_node
      - emergency_stop_action_bt_node
    error_code_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    # CRITICAL: must match the actual odom publisher topic.
    # Default is 'odom', but this robot publishes to '/odometry'.
    # Without this, controller always sees velocity=0, DWA window is stuck at
    # [0, acc*control_dt] = [0, 0.125 m/s] and robot never exceeds ~0.1 m/s.
    odom_topic: "/odometry"
    transform_tolerance: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.8  # Daha toleranslı
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 35.0  # Artırıldı: yön dönüşü için yeterli süre
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5  # Daha toleranslı
      yaw_goal_tolerance: 3.14  # Daha toleranslı
        # DWB parameters
    FollowPath:
      plugin: "robot_custom_local_planner::CustomLocalPlanner"

      # ── Ackermann geometry ──────────────────────────────────────────────────
      # MUST match robot hardware (kinco_bridge.py constants)
      wheelbase:          1.0957   # m  — URDF direction_motor_joint origin x
      max_steering_angle: 1.5708   # rad (~90°) — physical front-wheel limit

      # ── Velocity limits ─────────────────────────────────────────────────────
      max_linear_vel:  0.5    # m/s — forward max
      min_linear_vel:  0.05   # m/s — forward minimum (keeps motor alive)
      max_reverse_vel: 0.0    # m/s — 0 = no reverse; set > 0 to enable
      max_angular_vel: 0.8    # rad/s — cap for rotate-in-place wz

      # ── Acceleration / rate limits ───────────────────────────────────────────
      # linear_acc_limit = TRACTION_SLEW_RATE(5.0 rad/s²) × WHEEL_RADIUS(0.109 m)
      linear_acc_limit:   0.545  # m/s²
      # steering_slew_rate matches kinco_drive_node.py STEERING_SLEW_RATE
      steering_slew_rate: 1.5    # rad/s

      # ── Trajectory sampling ──────────────────────────────────────────────────
      # Normal: linear_samples × steering_samples = 7 × 11 = 77 trajectories
      # + rotate_samples (when heading error > heading_error_trigger)
      linear_samples:   7
      steering_samples: 11    # odd → includes δ=0 (straight ahead)
      rotate_samples:   7     # rotate-in-place candidates (↑ more options at corners)
      rotate_max_vel:   0.7   # rad/s — max angular vel for in-place rotation (↑ faster corner recovery)
      heading_error_trigger: 0.25  # rad (~14°) — threshold to add rotate samples (earlier corner detection)
      sim_time:         2.0   # s   — trajectory simulation horizon
      sim_granularity:  0.1   # s   — 20 steps per trajectory
      control_duration: 0.5   # s   — DWA velocity window = acc × control_duration

      # ── Cost function weights ────────────────────────────────────────────────
      # path_distance == heading_alignment: at corners both pull equally.
      # On straights path_distance dominates (heading error ≈ 0 → heading term ≈ 0).
      # At corners heading_alignment rises → equal competition → robot turns early.
      path_distance_weight:    100.0   # Penalise deviation from global path  [1/m]  (↑↑ tight lateral on straights)
      heading_alignment_weight: 60.0   # Align with path tangent direction    [1/rad]  (= path weight → corners turn properly)
      goal_distance_weight:     24.0   # Pull toward local carrot point       [1/m]
      obstacle_weight:           1.0   # Penalise costmap inflation cost
      velocity_reward_weight:    1.0   # Reward forward speed  (↓↓ can no longer buy lateral deviation)
      steering_penalty_weight:   0.5   # Penalise large δ²  (allow steering freely at corners)

      # ── Tolerances ───────────────────────────────────────────────────────────
      xy_goal_tolerance:   0.5
      yaw_goal_tolerance:  3.14
      transform_tolerance: 0.5
      prune_plan_distance: 2.0   # m  (↓ carrot now 2m away, matches ~sim horizon; goal_distance term now effective)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.06
      footprint: "[[0.5, 0.45], [0.5, -0.45], [-0.5, -0.45], [-0.5, 0.45]]"
      plugins: ["static_layer", "prohibited_layer", "inflation_layer"]
      
      prohibited_layer:
        plugin: "robot_custom_layers/ProhibitedLayer"
        enabled: True
        cost_value: 254
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.0
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: true
      #   publish_voxel_map: true
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.0
      #   mark_threshold: 0
      #   observation_sources: scan1 scan2
      #   scan1:
      #     topic: /lidar_left_1/scan
      #     max_obstacle_height: 2.0
      #     clearing: true
      #     marking: true
      #     data_type: "LaserScan"
      #     raytrace_max_range: 8.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 6.0
      #     obstacle_min_range: 0.0
      #   scan2:
      #     topic: /lidar_right_1/scan
      #     max_obstacle_height: 2.0
      #     clearing: true
      #     marking: true
      #     data_type: "LaserScan"
      #     raytrace_max_range: 8.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 6.0
      #     obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: false
      update_frequency: 1.0  # Çok düşük frekans - minimal kullanım
      publish_frequency: 1.0  # Çok düşük frekans - minimal kullanım
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      footprint: "[[0.5, 0.45], [0.5, -0.45], [-0.5, -0.45], [-0.5, 0.45]]"
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "prohibited_layer", "inflation_layer"]
      
      prohibited_layer:
        plugin: "robot_custom_layers/ProhibitedLayer"
        enabled: True
        cost_value: 254

      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: true
      #   observation_sources: scan1 scan2
      #   scan1:
      #     topic: /lidar_left_1/scan
      #     max_obstacle_height: 2.0
      #     clearing: true
      #     marking: true
      #     data_type: "LaserScan"
      #     raytrace_max_range: 8.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 6.0
      #     obstacle_min_range: 0.0
      #   scan2:
      #     topic: /lidar_right_1/scan
      #     max_obstacle_height: 2.0
      #     clearing: true
      #     marking: true
      #     data_type: "LaserScan"
      #     raytrace_max_range: 8.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 6.0
      #     obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 1.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    #expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GraphPlanner"]
    
    # Graph-based planner - Node ve edge'lerden oluşan graph ile path planning
    GraphPlanner:
      plugin: "robot_graph_based_global_planner::GraphBasedPlanner"
      graph_file_path: "$(find-pkg-share robot_navigation)/graphs/robot_map_graph.json"
      # Node'lar arasında kaç metre aralıklarla pose eklenecek
      interpolation_resolution: 0.1
      # Başlangıç/hedef için en yakın node'u ararken maksimum mesafe (metre)
      max_node_search_radius: 5.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 0.3  # Düşürüldü: dar açılarda recovery spin kilitlenmesin
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Tricycle (non-holonomic): [Vx, Vy=0, W]
    max_velocity: [0.5, 0.0, 1.0]      # Y=0: tricycle cannot move sideways
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/tricycle_controller/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "map"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 0.6
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan1", "scan2"]
    scan1:
      type: "scan"
      topic: "/lidar_left_1/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True
    scan2:
      type: "scan"
      topic: "/lidar_right_1/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True