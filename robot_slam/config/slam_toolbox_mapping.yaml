# =============================================================================
#  robot_slam — slam_toolbox Mapping Configuration
#  Robot: Mecanum AGV
#  Sensor: Dual SICK S30B LiDAR (merged scan on /scan)
#
#  MAPPING MODE ONLY.
#  Localization is handled by factor_graph_optimization (FGO), not slam_toolbox.
# =============================================================================

slam_toolbox:
  ros__parameters:

    # ── Solver ────────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frames & Topics ───────────────────────────────────────────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /scan          # merged dual SICK S30B output

    # ── Mode ──────────────────────────────────────────────────────────────────
    # MAPPING only. Do NOT change to localization — FGO handles localization.
    mode: mapping
    use_map_saver: true

    # ── Timing ────────────────────────────────────────────────────────────────
    # 50 Hz TF publish — matches FGO optimization_rate_hz and odom TF rate.
    transform_publish_period: 0.02
    # Rebuild /map topic every 5 s (expensive operation — avoid too frequent).
    map_update_interval:      5.0
    # Minimum time between processed scans (s).
    # At 0.1 s (10 Hz effective), CPU is manageable while keeping good detail.
    minimum_time_interval:    0.1
    tf_buffer_duration:       30.0
    transform_timeout:        0.2
    stack_size_to_use:        40000000   # 40 MB

    # ── Map resolution ────────────────────────────────────────────────────────
    # 0.05 m/cell = 5 cm. Standard for indoor AGV corridors.
    # SICK S30B angular resolution 0.167° → ~2.9 cm at 10 m → 5 cm cell is appropriate.
    resolution: 0.05

    # ── Laser range ───────────────────────────────────────────────────────────
    # SICK S30B: 30 m max range (indoor safety mode, high-density objects).
    # Cap at 25 m to avoid using marginal edge-of-range measurements in mapping.
    max_laser_range: 25.0
    throttle_scans:  1         # process every scan (no skipping)

    # ── Keyframe thresholds ───────────────────────────────────────────────────
    # Must match factor_graph_optimization keyframe thresholds so slam_toolbox
    # and FGO agree on when a meaningful pose change has occurred.
    # FGO values: keyframe.translation_threshold = 0.02 m
    #             keyframe.rotation_threshold     = 0.02 rad
    minimum_travel_distance: 0.02    # metres — same as FGO keyframe threshold
    minimum_travel_heading:  0.02    # radians — same as FGO keyframe threshold

    # ── Scan matching ─────────────────────────────────────────────────────────
    use_scan_matching:    true
    use_scan_barycenter:  true
    scan_buffer_size:                    10
    scan_buffer_maximum_scan_distance:   25.0
    link_match_minimum_response_fine:    0.1
    link_scan_maximum_distance:          2.0    # max distance to link consecutive scans
    enable_interactive_mode:             false  # disable in production (CPU overhead)
    debug_logging:                       false

    # ── Loop closure ──────────────────────────────────────────────────────────
    do_loop_closing:                    true
    loop_search_maximum_distance:       5.0    # search radius for loop candidates (m)
    loop_match_minimum_chain_size:      10     # min scan chain length to attempt closure
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine:   0.45

    # ── Correlation search (fine matching) ───────────────────────────────────
    correlation_search_space_dimension:   0.5
    correlation_search_space_resolution:  0.01
    correlation_search_space_smear_deviation: 0.1

    # ── Correlation search (loop closure) ───────────────────────────────────
    loop_search_space_dimension:          8.0
    loop_search_space_resolution:         0.05
    loop_search_space_smear_deviation:    0.03

    # ── Scan matcher penalties ────────────────────────────────────────────────
    distance_variance_penalty:  0.5
    angle_variance_penalty:     1.0
    fine_search_angle_offset:   0.00349     # ~0.2 deg
    coarse_search_angle_offset: 0.349       # ~20 deg
    coarse_angle_resolution:    0.0349      # ~2 deg
    minimum_angle_penalty:      0.9
    minimum_distance_penalty:   0.5
    use_response_expansion:     true
