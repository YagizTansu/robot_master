slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /lidar_top/scan
    use_map_saver: true
    mode: mapping

    # Debug parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # 50 Hz
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 35.0          # lidar_top max=40m; 35m güvenli margin
    minimum_time_interval: 0.1    # lidar_top 10Hz → 0.1s; her scan işlenir
    transform_timeout: 0.3        # büyük robot + Ackermann kinematiği için tolerans
    tf_buffer_duration: 30.0
    stack_size_to_use: 80000000  # 80MB — büyük harita için
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3        # daha sık scan → odom drift birikmeden önce düzeltme
    minimum_travel_heading: 0.3
    scan_buffer_size: 20                   # daha fazla scan hafızada → daha iyi lokal matching
    scan_buffer_maximum_scan_distance: 15.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 8.0     # KRITIK: büyük haritada döngü tespiti için geniş arama
    do_loop_closing: true
    loop_match_minimum_chain_size: 6       # daha az düğümle loop tespit et
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.3  # eşiği düşür → daha fazla loop closure denemesi
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Tuned for warehouse environment
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure
    loop_search_space_dimension: 12.0     # büyük haritada loop closure pozisyon arama alanı
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
