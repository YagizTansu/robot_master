### robot_localization EKF — SLAM mapping only
### Purpose: publish odom → base_footprint TF from Gazebo /odometry
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    map_frame: map

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    # /odometry — nav_msgs/Odometry from Gazebo bridge
    odom0: /odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
