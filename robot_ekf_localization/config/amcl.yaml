amcl:
  ros__parameters:
    use_sim_time: true

    # ── Particle filter ────────────────────────────────────────────────────
    min_particles: 1000
    max_particles: 5000
    kld_err: 0.03
    kld_z: 0.99
    update_min_d: 0.05        # (m) bu kadar hareket etince güncelle
    update_min_a: 0.05        # (rad) bu kadar dönünce güncelle
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # ── Lazer modeli ───────────────────────────────────────────────────────
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    laser_min_range: 0.1
    max_beams: 60
    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    sigma_hit: 0.15
    lambda_short: 0.1
    likelihood_field_dsmax: 2.0

    # ── Hareket modeli ─────────────────────────────────────────────────────
    # Forklift tricycle → DifferentialMotionModel davranışına en yakın
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2    # dönüşten kaynaklanan dönüş gürültüsü
    alpha2: 0.2    # öteleme hareketinden kaynaklanan dönüş gürültüsü
    alpha3: 0.2    # öteleme hareketinden kaynaklanan öteleme gürültüsü
    alpha4: 0.2    # dönüş hareketinden kaynaklanan öteleme gürültüsü

    # ── Frame'ler ──────────────────────────────────────────────────────────
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    # ── Scan topic ─────────────────────────────────────────────────────────
    scan_topic: /lidar_top/scan

    # ── TF: KAPATILDI — map→odom TF'ini EKF global yayınlar ───────────────
    tf_broadcast: false

    # ── Başlangıç pozu ─────────────────────────────────────────────────────
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # ── Diğer ─────────────────────────────────────────────────────────────
    transform_tolerance: 3.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    save_pose_rate: 0.5
