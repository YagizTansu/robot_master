amcl:
  ros__parameters:
    use_sim_time: false

    # ── Particle filter ────────────────────────────────────────────────────
    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99
    update_min_d: 0.1         # (m) bu kadar hareket etince güncelle
    update_min_a: 0.314       # (rad) bu kadar dönünce güncelle
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # ── Lazer modeli ───────────────────────────────────────────────────────
    laser_model_type: likelihood_field_prob
    laser_max_range: 6.0
    laser_min_range: 0.1
    max_beams: 180
    z_hit: 0.80
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.10
    sigma_hit: 0.2
    lambda_short: 0.1
    likelihood_field_dsmax: 2.0

    # ── Hareket modeli ─────────────────────────────────────────────────────
    # Forklift tricycle → DifferentialMotionModel davranışına en yakın
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.01    # dönüşten kaynaklanan dönüş gürültüsü
    alpha2: 0.01    # öteleme hareketinden kaynaklanan dönüş gürültüsü
    alpha3: 0.02    # öteleme hareketinden kaynaklanan öteleme gürültüsü
    alpha4: 0.01    # dönüş hareketinden kaynaklanan öteleme gürültüsü

    # ── Frame'ler ──────────────────────────────────────────────────────────
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    # ── Scan topic ─────────────────────────────────────────────────────────
    scan_topic: /lidar_top/scan

    # ── TF: AÇILDI — map→odom TF'ini doğrudan AMCL yayınlar ──────────────
    tf_broadcast: true

    # ── Başlangıç pozu ─────────────────────────────────────────────────────
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # ── Diğer ─────────────────────────────────────────────────────────────
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    save_pose_rate: 0.5
