ekf_local_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    map_frame: map

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    # IMU ve odom mesajları aynı anda gelmeyebilir; geçmişi tutarak
    # geç gelen mesajları doğru zaman dilimine yerleştirir
    smooth_lagged_data: true
    history_length: 0.3

    odom0: /odom_kinco
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_pose_rejection_threshold: 10.0
    odom0_twist_rejection_threshold: 5.0

    pose0: /slamware_odom
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
    pose0_pose_rejection_threshold: 5.0
    pose0_twist_rejection_threshold: 2.0

  #                             x,      y,      z,   roll,  pitch,    yaw,     vx,      vy,      vz,  vroll, vpitch,   vyaw,     ax,     ay,     az
