controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_controller:
      type: position_controllers/JointGroupPositionController

    traction_controller:
      type: velocity_controllers/JointGroupVelocityController

    lift_controller:
      type: position_controllers/JointGroupPositionController

steering_controller:
  ros__parameters:
    joints:
      - direction_motor_joint

traction_controller:
  ros__parameters:
    joints:
      - drive_motor_joint

lift_controller:
  ros__parameters:
    joints:
      - lift_joint
