controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tricycle_controller:
      type: tricycle_controller/TricycleController

tricycle_controller:
  ros__parameters:
    traction_joint_name: drive_motor_joint
    steering_joint_name: direction_motor_joint

    # Geometry (measured via circle fitting from STL meshes)
    wheelbase: 1.0957      # meters — front drive axle to rear caster axle
    wheel_radius: 0.109    # meters — drive wheel radius

    # Odometry frames
    odom_frame_id: odom
    base_frame_id: base_link

    # Odometry covariance
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 500
    velocity_rolling_window_size: 10

    # Traction (drive wheel) limits  — rad/s at wheel (all values must be positive)
    traction:
      max_velocity: 5.0       # ~1.96 m/s forward
      min_velocity: 0.0
      max_acceleration: 2.0
      min_acceleration: 0.0
      max_deceleration: 4.0
      min_deceleration: 0.0

    # Steering limits (min_position/min_velocity can be negative for direction)
    steering:
      max_position: 1.5707    # 90 deg
      min_position: -1.5707
      max_velocity: 1.0       # rad/s
      min_velocity: 0.0
      max_acceleration: 2.0
      min_acceleration: 0.0
