# ============================================================
#  fgo_transformer — Transformer Inference Node Parameters
# ============================================================

transformer_inference:
  ros__parameters:

    # ── Model checkpoint ─────────────────────────────────────────────────────
    # Absolute path to best.pt.
    # Default: resolved at runtime via ament_index to <pkg_share>/data/checkpoints/best.pt
    # Override with the absolute path produced by training, e.g.:
    #   checkpoint_path: "/home/yagiz/fgo_training_data/checkpoints/best.pt"
    checkpoint_path: ""

    # ── Inference rate ───────────────────────────────────────────────────────
    # How often (Hz) to run the model and publish /transformer/trust_scores.
    # 10 Hz matches the FGO update rate and keeps CPU load minimal.
    publish_rate_hz: 10.0

    # ── Sliding window ───────────────────────────────────────────────────────
    # Must match seq_len used during training (ModelConfig.seq_len = 20).
    seq_len: 20

    # ── IMU buffer ───────────────────────────────────────────────────────────
    imu_buffer_size: 50

    # ── Physics constants ────────────────────────────────────────────────────
    gravity: 9.81

    # ── Fitness staleness threshold (s) ─────────────────────────────────────
    # If no fitness message arrives within this window, the feature is NaN-filled.
    max_fitness_age_sec: 2.0

    # ── NaN fill value ───────────────────────────────────────────────────────
    # Replaces NaN features before normalization (0.0 = feature mean after norm).
    nan_fill: 0.0
