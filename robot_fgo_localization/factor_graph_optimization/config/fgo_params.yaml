# ============================================================
#  factor_graph_optimization — FGO Parameter File
#  All parameters used by both fgo_node and scan_matcher_node.
#  NO hardcoded values are present in the C++ source code.
# ============================================================

fgo_node:
  ros__parameters:

    # ── Sensor Toggles ──────────────────────────────────────
    sensors:
      enable_odom:  true
      enable_imu:   true
      enable_lidar: true
      enable_gps:   false   # set to true when GPS hardware is present

    # ── Topic Names ─────────────────────────────────────────
    topics:
      odom_topic:             "/tricycle_controller/odom"  # doğrudan ros2_controllers çıktısı
      imu_topic:              "/imu/data"       # ros_gz_bridge: gz → /imu/data
      scan_match_pose_topic:  "/scan_match_pose"
      initial_pose_topic:     "/initialpose"
      gps_topic:              "/gps/fix"  # standard nmea_navsat_driver / ublox_gps topic

    # ── Frame IDs ───────────────────────────────────────────
    frames:
      map_frame:    "map"
      odom_frame:   "odom"
      base_frame:   "base_link"   # URDF root link
      imu_frame:    "imu_link"

    # ── TF Publishing ───────────────────────────────────────
    tf:
      publish_map_to_odom:    true
      publish_odom_to_base:   true

    # ── Initial Pose ────────────────────────────────────────
    initial_pose:
      x:     0.0
      y:     0.0
      z:     0.0
      roll:  0.0
      pitch: 0.0
      yaw:   0.0

    # ── Noise Models ────────────────────────────────────────
    noise:
      odometry:
        # Tricycle drive (non-holonomic): encoder-based odometry from tricycle_controller.
        # x: primary motion direction, ~1% slip → 0.01 m per keyframe.
        # y: tricycle CANNOT slide sideways → very tight (0.005 m).
        # yaw: steering encoder is precise → 0.03 rad (1.7°) is conservative but safe.
        x:     0.01
        y:     0.005  # non-holonomic constraint — no lateral slip
        z:     0.01   # constrained — flat surface
        roll:  0.01   # constrained — flat surface
        pitch: 0.01   # constrained — flat surface
        yaw:   0.03   # tricycle steering encoder, tighter than mecanum

      imu:
        # Accelerometer white noise (sigma in m/s^2/sqrt(Hz)).
        # Gazebo IMU: stddev=0.017 m/s² per sample @ 100 Hz.
        # PSD conversion: sigma_c = sigma_d × √rate = 0.017 × √100 = 0.17 m/s²/√Hz
        accel_sigma:       0.17

        # Gyroscope white noise (sigma in rad/s/sqrt(Hz)).
        # Gazebo IMU: stddev=0.0002 rad/s per sample @ 100 Hz.
        # PSD conversion: sigma_c = 0.0002 × √100 = 0.002 rad/s/√Hz ✓
        gyro_sigma:        0.002

        # Accelerometer bias random walk (sigma in m/s^3/sqrt(Hz)).
        # Slower process — keep small.
        accel_bias_sigma:  0.0001

        # Gyroscope bias random walk (sigma in rad/s^2/sqrt(Hz)).
        # Typical MEMS IMU: 1e-4 to 1e-3. Previously was 1e-6 (too tight).
        gyro_bias_sigma:   0.0001

        # Numerical integration noise sigma (trapezoidal discretisation error).
        integration_sigma: 0.0001

        # Bias integration cross-coupling noise (6x6 diagonal, dimensionless scale).
        # Keeps bias random-walk numerically stable inside preintegration.
        bias_acc_omega_int: 1.0e-5

        # Gravity magnitude (m/s^2). Used in ENU Z-up convention.
        gravity:           9.81
      gps:
        # Consumer GPS circular error probable (CEP) ≈ 2.5 m.
        # 1σ = CEP / 0.8326 ≈ 3.0 m at 68% confidence (before HDOP scaling).
        # Override to 0.05 for RTK-grade receivers.
        # NOTE: noise.lidar lives in scan_matcher_node below — do NOT add it here.
        sigma_x: 3.0   # metres (1-sigma, before HDOP scaling)
        sigma_y: 3.0   # metres (1-sigma, before HDOP scaling)
    # ── LiDAR gating ────────────────────────────────────────
    lidar:
      gating:
        # Per-scan rotation gate (rad). Each scan is evaluated independently
        # against the instantaneous |dyaw| of its nearest keyframe interval.
        # Must be BELOW keyframe.rotation_threshold (0.02 rad): a rotation
        # keyframe always contributes dyaw >= 0.02, so 0.010 reliably blocks
        # scans attributed to rotation keyframes while never blocking scans
        # attributed to translation keyframes (instantaneous dyaw ~ 0).
        # Tighter than 0.015 — discards more scans during subtle rotation arcs
        # so only truly straight-line segments feed the graph.
        rotation_gate_rad:   0.010  # was 0.015
        # Discard scan poses older than this (sec). Prevents stale scans after a pause.
        max_scan_age_sec:    2.0    # was 1.0 — safety margin for slower NDT with finer voxels (0.010 m leaf)
        # How far back (sec) to search past keyframes when matching a scan.
        # NDT latency is ~60 ms → 0.3 s gives 5× safety margin at 1.5 m/s.
        # The deque holds ~15-30 KeyframeRecords at 50 Hz — negligible memory.
        scan_keyframe_history_sec: 0.6

    # ── iSAM2 ───────────────────────────────────────────────
    isam2:
      relinearize_threshold:  0.01  # was 0.05 — more aggressive relinearization; any variable that shifts > 1 % of its tangent-space is re-evaluated → tighter posterior at every update
      relinearize_skip:       1     # relinearize every update pass (minimum; do not raise)
      factorization:          "QR"  # was "CHOLESKY"; QR is slower but numerically stable for near-singular information matrices

    # ── Node timing ─────────────────────────────────────────
    node:
      optimization_rate_hz:   50.0
      max_pending_scans:      10    # max scan-match poses buffered; oldest dropped when exceeded
      max_pending_imu:        2000  # 100 Hz × 20 s safety cap; prevents unbounded growth if optimizer stalls
      max_pending_odom:       500   # generous keyframe buffer cap
      max_pending_gps:        100   # 10 Hz × 10 s; prevents unbounded growth if optimizer stalls
      graph_max_size:         10000 # was 5000 — even larger sliding window; retains more past constraints for better global consistency in long runs (+memory)
      max_path_length:        10000 # cap on /fgo/path pose history; oldest poses dropped when exceeded (0 = unlimited)

    # ── Prior factors on X(0) ───────────────────────────────
    prior:
      pose_pos_sigma:   0.05     # 5 cm — allows first scan match to anchor absolute
                                 # map position without being overwhelmed by the prior.
                                 # Previously 0.001 m (1 mm) which prevented any
                                 # scan-match correction of startup pose error.
      pose_z_sigma:     0.0001    # 1 mm — flat-ground robot, z is known at startup
      pose_rot_sigma:   0.05     # ~2.9 deg yaw uncertainty at startup
      pose_roll_sigma:  0.0001    # flat surface — roll is known (0) at startup
      pose_pitch_sigma: 0.0001    # flat surface — pitch is known (0) at startup
      vel_sigma:        1.0      # generous — robot starts approx. at rest
      bias_accel_sigma: 0.3      # accel bias uncertainty at startup
      bias_gyro_sigma:  0.05     # gyro  bias uncertainty at startup

    # ── Fallback noise when IMU is disabled ─────────────────
    fallback:
      vel_sigma:        0.5
      bias_accel_sigma: 0.01
      bias_gyro_sigma:  0.001

    # ── Keyframe Strategy ───────────────────────────────────
    keyframe:
      translation_threshold:  0.02
      rotation_threshold:     0.02
      max_time_sec:           2.0    # force a keyframe after this interval even when stationary


    # ── GPS ───────────────────────────────────────────────────────
    # sensors.enable_gps, topics.gps_topic, node.max_pending_gps, and
    # noise.gps are defined in their respective sections above.
    gps:
      # Quality gates
      # HDOP < 1: excellent, 1-2: good, 2-5: moderate, > 5: poor.
      # 2.0 admits standard GPS in open-sky conditions.
      # Set 0.0 to disable HDOP gating (not recommended).
      hdop_reject_threshold: 2.0

      # Maximum distance (m) from last accepted fix before a new fix is
      # rejected as an outlier.  At 1 m/s this is 10 s of motion budget.
      # Set 0.0 to disable outlier gating.
      outlier_reject_dist_m: 10.0

      # UTM zone configuration.
      # utm_zone = 0: auto-detect from first valid fix (recommended).
      # utm_zone = 1-60: force a specific zone (use for pre-mapped deployments).
      utm_zone: 0
      utm_hemisphere: "N"   # "N" or "S"; only used when utm_zone != 0

      # Number of consecutive OUTLIER-PATH rejections before the outlier baseline
      # is reset to the current fix position.  Note: consecutive_rejects_ is
      # incremented by all rejection types (fix-type, HDOP, NaN, outlier), but
      # only a rejection in the outlier-distance check can trigger this reset,
      # because earlier gates return before reaching the outlier block.
      # Prevents permanent GPS lockout after graph re-initialisation or extended GPS outage.
      outlier_strike_limit: 10

      # GPS antenna offset from base_link in the body frame (metres).
      # forward = +x, left = +y.  Applied inside GraphManager before factor creation.
      offset_x: 0.0
      offset_y: 0.0

      # Minimum accepted NavSatFix quality (internal 0/1/2 convention):
      #   0 = accept any status (including NO_FIX — rarely useful)
      #   1 = accept STATUS_FIX and above   (recommended default)
      #   2 = accept STATUS_SBAS_FIX / DGPS corrections and above (RTK setups)
      min_fix_type: 1


scan_matcher_node:
  ros__parameters:

    # ── Topics (only those actually subscribed/published) ───
    topics:
      lidar_topic:            "/lidar_top/scan"  # VLP-16 @ 2.051m: 360°, stabil duvar/raf geometrisi → NDT için ideal
      scan_match_pose_topic:  "/scan_match_pose"
      map_topic:              "/map"

    # ── Frame IDs ───────────────────────────────────────────
    frames:
      lidar_frame:  "lidar_top"  # scan noktaları lidar_top frame'inde z=0 → map cloud (z=0) ile eşleşir
                                  # base_link kullansaydık z=2.051m → max_correspondence_dist(1.0m) aşılır → NDT başarısız

    # ── LiDAR noise (written into published covariance msg) ─
    # SICK S30B sensor noise stddev = 0.02 m (SDF). NDT matching adds ~0.02-0.03 m
    # on top of raw sensor noise → total 1σ ≈ 0.05 m is a conservative but realistic base.
    noise:
      lidar:
        x:     0.05
        y:     0.05
        z:     999.0   # 2D scanner provides no z information — keep this DOF unconstrained
        roll:  999.0   # 2D scanner provides no roll information — keep unconstrained
        pitch: 999.0   # 2D scanner provides no pitch information — keep unconstrained
        yaw:   0.05

    # ── Scan Matcher ─────────────────────────────────────────
    scan_matcher:
      type:                    "NDT"
      max_iterations:          50
      max_correspondence_dist: 2.0  # lidar_top 0.84m ilerde → initial_guess ~0.84m offset; 2.0m yeterli margin sağlar
      transformation_epsilon:  1.0e-6
      map_z_height:            0.0
      # NDT internal voxel resolution (m). Should be 2-5x the map voxel leaf size.
      # PCL VoxelGridCovariance requires >= 6 points per voxel. Walls are 1-D geometry:
      # points per voxel ≈ ndt_resolution / map_voxel_leaf_size.
      # With leaf=0.010 m → ratio=15 ≥ 6: very safe margin even in sparse open areas.
      # DO NOT go below 0.10 m with leaf=0.010 m — 2D laser data is too sparse at corners.
      ndt_resolution:          0.15  # ratio=0.15/0.010=15 ✓ — restores searchable voxels while keeping fine leaf detail
      # Newton gradient-descent step size (m). One of the most impactful NDT
      # convergence parameters. Smaller = more stable, more iterations.
      ndt_step_size:           0.02  # was 0.05 — finer gradient step prevents overshooting the local minimum; essential with smaller voxels
      # Discard scan if fitness score > this (applies to both NDT and ICP).
      # With 200 iterations + finer voxels, good scans now reliably converge to < 0.10;
      # a threshold of 0.15 still passes high-quality matches while rejecting poor ones.
      fitness_score_threshold: 0.15  # was 0.25
      # sigma *= (1 + fitness_noise_scale * fitness_score) — applied before publishing.
      # With a tighter gate and finer voxels, accepted matches are already very high-quality;
      # lower scale keeps the covariance tight inside the FGO graph.
      fitness_noise_scale:     1.0   # was 2.0
      # VoxelGrid leaf size for map cloud downsampling (m).
      # 0.010 m gives 2× finer map detail vs 0.020 m, while keeping
      # ndt_resolution/leaf_size = 0.10/0.010 = 10 — safely above PCL's 6-point minimum.
      map_voxel_leaf_size:     0.010 # was 0.020 — 2× finer map detail; constraint: 0.10/0.010=10 ≥ 6 ✓
      # VoxelGrid leaf size applied to the source scan before matching (m; 0 = skip)
      # Should be equal to or smaller than map_voxel_leaf_size so densities are symmetric.
      scan_voxel_leaf_size:    0.010 # was 0.020 — symmetric with map_voxel_leaf_size
      # Frame written into the published scan-pose message (must match fgo_node map_frame)
      map_frame:               "map"
      # ICP-only: RANSAC outlier rejection (0 iterations = disabled)
      icp_ransac_iterations:   5
      icp_ransac_threshold:    0.05  # inlier distance threshold (m)

# ============================================================
# trust_weight_bridge node parameters
# ============================================================
trust_weight_bridge:
  ros__parameters:

    # ── Operating mode ───────────────────────────────────────────────────────
    # manual_mode: true  → weights come from manual_w_* parameters below.
    #              false → weights come from /transformer/trust_scores topic.
    # Switch at runtime with: ros2 service call /fgo/set_trust_weights std_srvs/srv/SetBool "{data: false}"
    manual_mode: true

    # ── Manual weights (used when manual_mode = true) ────────────────────────
    # 1.0 = full trust (identical to the original static noise model).
    # Lower values widen the factor's noise sigma (reduce information weight).
    manual_w_encoder: 1.0   # wheel odometry  — BetweenFactor<Pose3>
    manual_w_imu:     1.0   # IMU preint      — CombinedImuFactor (via velocity prior)
    manual_w_lidar:   1.0   # LiDAR scan match — PriorFactor<Pose3>
    manual_w_gps:     0.0   # GPS/GNSS         — GPSFactor (disabled — no GPS sensor)

    # ── Topic remapping ──────────────────────────────────────────────────────
    topic_in:  "/transformer/trust_scores"   # std_msgs/Float64MultiArray [encoder, imu, lidar, gps]
    topic_out: "/fgo/trust_weights"          # same format, after clamping to [EPSILON, 1.0]
